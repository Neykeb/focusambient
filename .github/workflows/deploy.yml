name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: App prüfen und bauen
        run: npm run check
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v6

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
